<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrarme — Pancho</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23DFFF00'/><text y='.9em' font-size='70' x='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold'>P</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  /* Register: form-box un poco más ancho por los campos extra */
  .form-box { max-width: 520px; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-mark"><span>P</span></div>
    <div class="logo-text">PANCHO</div>
  </a>
  <a href="index.html" class="nav-back">Volver al inicio</a>
</nav>

<div class="page">
  <div class="form-box">

    <div class="form-header">
      <h1 class="form-title">Registrarme</h1>
      <p class="form-subtitle">¿Ya tenés cuenta? <a href="login.html">Ingresá acá</a></p>
    </div>

    <!-- Botón Google — el Client ID vive en el backend, nunca acá -->
    <a href="#" class="btn-google" id="btn-google-register">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Registrarme con Google
    </a>

    <div class="divider-or"><span>o completá tus datos</span></div>

    <!-- Error message -->
    <p id="form-error" style="display:none; color:#ff4444; font-size:13px; margin-bottom:1rem; text-align:center;"></p>

    <form id="register-form" novalidate>

      <!-- HONEYPOT: invisible para humanos, visible para bots
           El backend rechaza cualquier envío donde este campo tenga valor -->
      <div class="hp-field" aria-hidden="true">
        <label for="hp_website">No completar</label>
        <input type="text" id="hp_website" name="hp_website" tabindex="-1" autocomplete="off">
      </div>

      <div class="fields-row">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Juan" required autocomplete="given-name">
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="García" required autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" name="empresa" placeholder="Mi Empresa S.A." required autocomplete="organization">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
        <div class="password-strength">
          <div class="strength-bar" id="bar1"></div>
          <div class="strength-bar" id="bar2"></div>
          <div class="strength-bar" id="bar3"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>

      <button type="submit" class="btn-submit">Crear cuenta gratis</button>

      <p class="terms-note">
        Al crear tu cuenta aceptás los
        <a href="#">Términos y condiciones</a> y la
        <a href="#">Política de privacidad</a>.
      </p>

    </form>

    <p class="form-footer">¿Ya tenés cuenta? <a href="login.html">Ingresá →</a></p>

  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
